[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsnitch"
version = "0.1.0"
description = "Local-only tracing and cost/health auditing for AI coding agents. Zero network code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # stdlib only, forever — this is a design constraint

[project.scripts]
llmsnitch = "llmsnitch.cli:main"

[tool.setuptools]
# fs_coil ships too: the scan's notify routing imports it, and a pipx venv
# without it silently degrades to ledger-only (T204 found this live).
# Both copies (this one and the /usr/local/share live tree) converge on the
# same flock'd on-disk state, so coexistence is safe.
packages = ["llmsnitch", "fs_coil"]
