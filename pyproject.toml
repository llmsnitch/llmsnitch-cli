[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsnitch"
version = "0.1.0"
description = "Local-only tracing and cost/health auditing for AI coding agents. Zero network code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # stdlib only, forever — this is a design constraint

[project.scripts]
llmsnitch = "llmsnitch.cli:main"

[tool.setuptools]
packages = ["llmsnitch"]
